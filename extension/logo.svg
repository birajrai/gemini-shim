<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Star Primary Gradient -->
    <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Star Accent Gradient -->
    <linearGradient id="starGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Border Subtle Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Container Base (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.22" filter="url(#glow)" />
  <circle cx="270" cy="240" r="90" fill="#38bdf8" opacity="0.28" filter="url(#glow)" />

  <!-- Central Gemini Sparkle Star Shape -->
  <g filter="url(#glow)">
    <!-- Right / Upper Petal Layer -->
    <path d="M 256 70 C 256 172.8 339.2 256 442 256 C 339.2 256 256 339.2 256 442 C 256 339.2 172.8 256 70 256 C 172.8 256 256 172.8 256 70 Z" 
          fill="url(#starGrad1)" />
          
    <!-- Left / Lower Dimensional Facet Overlay -->
    <path d="M 256 70 C 256 172.8 339.2 256 442 256 C 310 270 270 310 256 442 C 256 339.2 172.8 256 70 256 C 200 240 240 200 256 70 Z" 
          fill="url(#starGrad2)" opacity="0.82" />

    <!-- Center Core Sparkle Prism -->
    <path d="M 256 176 L 278 234 L 336 256 L 278 278 L 256 336 L 234 278 L 176 256 L 234 234 Z" 
          fill="#ffffff" opacity="0.95" />
          
    <!-- Inner Core Dot -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Dynamic Satellite Particles (Fast Proxy & Gateway Accents) -->
  <circle cx="390" cy="120" r="9" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="385" r="7" fill="#a855f7" opacity="0.85" />
  <circle cx="380" cy="390" r="6" fill="#2dd4bf" opacity="0.75" />
</svg>
