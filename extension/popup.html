<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Shim Session Sync</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --secondary: #334155;
      --secondary-hover: #475569;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --secondary: #f1f5f9;
        --secondary-hover: #e2e8f0;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 380px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--secondary);
      color: var(--text-muted);
      margin-left: auto;
    }
    p.desc {
      color: var(--text-muted);
      margin-bottom: 14px;
      font-size: 12px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--card-bg);
      border-color: var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }
    #status-box {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--card-bg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .status-ok { color: var(--success); }
    .status-warn { color: var(--warning); }
    .status-err { color: var(--error); }
    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.svg" alt="Logo">
    <h1>gemini-shim</h1>
    <span class="badge">v1.0.0</span>
  </div>

  <p class="desc">Export Google session authentication & metadata for local <code>gemini-shim</code> or Cloudflare Workers.</p>

  <div class="btn-group">
    <button id="open" type="button" class="btn-secondary">Open Gemini Web</button>
    <button id="inspect" type="button" class="btn-secondary">Inspect Session</button>
    <button id="export-json" type="button" class="btn-primary">Export gemini-auth.json</button>
    <button id="copy-cf" type="button" class="btn-secondary">Copy Cloudflare COOKIE_STRING</button>
  </div>

  <div id="status-box">Ready. Click "Inspect Session" to check login.</div>

  <p class="footer-note">Sensitive session data is handled strictly in-memory and never sent to external servers.</p>

  <script src="popup.js"></script>
</body>
</html>
